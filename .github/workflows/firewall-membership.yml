name: Firewall Membership Check

# Assert every codified DO cloud firewall CONTAINS the droplets its Terraform
# names (GOL-2565).
#
# Why this is a separate workflow from terraform-drift.yml: that one runs a
# real `terraform plan`, so it needs the S3 backend, the env's TF_VARs, and it
# takes the state lock -- which is why it watches exactly one env and is not on
# a cron. This check needs none of that. It reads the *.tf in the repo and the
# DO API read-only, takes no lock, and touches no state, so it is safe to run
# nightly across every env at once and safe to run concurrently with an apply.
#
# The gap it closes: grove-prod-odoo was REPLACED on 2026-09-16 and
# grove-prod-odoo-fw was never re-converged onto the new droplet id. Its rules
# stayed correct, so a rules-only check passed; `droplet_ids` was `[]`, so
# production Odoo had no edge filtering at all and :22 was open to the
# internet for 13 days before a human happened to look. Nightly, this fires on
# day one.
#
# TWO LEGS, and the second is not a nicety (GOL-2576):
#
#   per-env   compares live membership against the repo's *.tf. Config-driven,
#             so it can only ever assert things we declared.
#   census    asks the DO ACCOUNT instead. Every live droplet must be behind
#             some firewall; no firewall may open :22 to the world.
#
# An UN-CODIFIED droplet has no Terraform resource, therefore no expectation,
# therefore no finding -- it is invisible to the per-env leg BY CONSTRUCTION.
# Two of five droplets were in exactly that state on 2026-09-29
# (ghostgoldberrygrove-nyc1 / GOL-2566, agenticos-droplet / GOL-2569) and BOTH
# were found by a hand-run audit. Nothing scheduled would have found either,
# and nothing scheduled would find the third. The census leg is what makes
# "nobody happened to look" stop being the detection mechanism.
on:
  schedule:
    - cron: "0 13 * * *" # daily, ~09:00 ET — before the market-season workday
  workflow_dispatch: {}

permissions: {}

concurrency:
  # Read-only and lock-free, so this never needs to serialize against an
  # apply — but there is no point stacking duplicate nightly runs either.
  group: firewall-membership
  cancel-in-progress: false

jobs:
  check:
    name: Assert firewall membership
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read # no id-token: 1Password uses a service-account token, not OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 2

      # Same read-only path terraform-drift.yml uses: a REPO-level
      # OP_CI_SA_TOKEN (grove-ci-prod-ro, read-only to Grove Prod), NOT a gated
      # `environment:` — gating a scheduled check behind production's required
      # reviewers would hang it every night. Vault is "Grove Prod" (GOL-2413);
      # "Grove Production" does not exist and fails the op load step.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        timeout-minutes: 2
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_CI_SA_TOKEN }}
          DIGITALOCEAN_TOKEN:      op://Grove Prod/odoocker/DIGITALOCEAN_TOKEN
          DISCORD_OPS_WEBHOOK_URL: op://Grove Prod/odoocker/DISCORD_OPS_WEBHOOK_URL
        with:
          export-env: true

      # production and observability are fail-closed: a declared droplet or
      # firewall that is absent live is drift, because neither env is meant to
      # be torn down. qa-app-platform IS torn down between release trains
      # (GOL-2327), so it runs --allow-absent — otherwise this alerts every
      # night the QA env is down, and an alert that always fires gets muted,
      # which is how GOL-2565 stayed invisible in the first place.
      - name: Check production + observability (fail-closed)
        id: strict
        timeout-minutes: 3
        run: |
          set +e
          ./infra/terraform/scripts/check-firewall-membership.py \
            production observability 2>&1 | tee strict.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Check qa-app-platform (tolerates teardown)
        id: ephemeral
        timeout-minutes: 3
        run: |
          set +e
          ./infra/terraform/scripts/check-firewall-membership.py \
            --allow-absent qa-app-platform 2>&1 | tee ephemeral.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Config-INDEPENDENT. Takes no env argument on purpose: it enumerates the
      # account, so a droplet nobody codified (and nobody remembered) is still
      # in scope. Exemptions live in a dated, GOL-referencing allowlist in the
      # repo — infra/terraform/firewall-census-allowlist.json — so an accepted
      # exposure is a reviewed commit, and an exemption that outlives its
      # `expires` date starts failing again by itself.
      - name: Account-wide census (no droplet outside a firewall, no world-open :22)
        id: census
        timeout-minutes: 3
        run: |
          set +e
          ./infra/terraform/scripts/check-firewall-membership.py --census 2>&1 | tee census.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Exit 2 is "bad env" (no token, DO unreachable) — a broken watcher, not
      # a clean bill of health. It must be as loud as drift, or the check
      # silently stops checking.
      - name: Alert Discord on drift, census finding, or broken check
        if: steps.strict.outputs.exitcode != '0' || steps.ephemeral.outputs.exitcode != '0' || steps.census.outputs.exitcode != '0'
        timeout-minutes: 1
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STRICT: ${{ steps.strict.outputs.exitcode }}
          EPHEMERAL: ${{ steps.ephemeral.outputs.exitcode }}
          CENSUS: ${{ steps.census.outputs.exitcode }}
        run: |
          # UNCOVERED / OPEN-SSH / ALLOWLIST are the census leg's finding
          # prefixes; DRIFT and ! are the per-env leg's. The census prints the
          # droplet name, id and created_at on the finding line itself, so the
          # alert carries enough to act on without opening the run.
          MEMBERSHIP="$(grep -hE '^[[:space:]]+(DRIFT|!)' strict.txt ephemeral.txt | head -10)"
          CENSUS_DETAIL="$(grep -hE '^[[:space:]]+(UNCOVERED|OPEN-SSH|ALLOWLIST)' census.txt | head -10)"
          DETAIL="$(printf '%s\n%s' "$MEMBERSHIP" "$CENSUS_DETAIL" | sed '/^$/d')"
          [ -n "$DETAIL" ] || DETAIL="check could not run (exit 2: no token, bad allowlist, or DO unreachable)"

          # Name what actually fired. "A firewall does not contain its droplets"
          # is the wrong sentence for "a droplet is behind no firewall at all",
          # and an alert that describes the wrong failure gets triaged as noise.
          if [ -n "$MEMBERSHIP" ] && [ -n "$CENSUS_DETAIL" ]; then
            TITLE="⚠️ Firewall membership drift AND an unprotected droplet"
            BLURB="Both legs fired: a codified firewall lost its droplet, and the account has a box or rule nothing covers."
          elif [ -n "$CENSUS_DETAIL" ]; then
            TITLE="⚠️ A droplet is behind no firewall, or :22 is open to the world"
            BLURB="The account-wide census found an exposure the per-env check cannot see (GOL-2576). Codify a firewall and apply, delete the dormant rule, or add a dated allowlist entry."
          else
            TITLE="⚠️ A DO firewall does not contain the droplets it names"
            BLURB="A codified firewall is not protecting its droplet — the box may be exposed at the DO edge."
          fi

          PAYLOAD=$(jq -n \
            --arg run_url "$RUN_URL" \
            --arg detail "$DETAIL" \
            --arg title "$TITLE" \
            --arg blurb "$BLURB" \
            '{
              username: "🧱 Firewall Membership",
              embeds: [{
                title: $title,
                description: ($blurb + "\n```\n" + $detail + "\n```"),
                url: $run_url,
                color: 15158332
              }]
            }')
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$DISCORD_OPS_WEBHOOK_URL"

      - name: Fail the run if membership drifted or the census found an exposure
        if: steps.strict.outputs.exitcode != '0' || steps.ephemeral.outputs.exitcode != '0' || steps.census.outputs.exitcode != '0'
        run: |
          echo "::error::firewall check failed (strict=${{ steps.strict.outputs.exitcode }} ephemeral=${{ steps.ephemeral.outputs.exitcode }} census=${{ steps.census.outputs.exitcode }})"
          exit 1
