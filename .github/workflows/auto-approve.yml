# Agent-mergeable path for odoocker (GOL-308 port of grove-sites GOL-122).
#
# Problem this solves:
#   Every Paperclip agent authors PRs under the SAME GitHub App bot
#   (agenticos-developer[bot]). This repo's `main-branch-protection` ruleset
#   requires 1 approving review, and GitHub blocks "approve your own pull
#   request", so no agent can satisfy the review gate. Our PR token has no
#   admin, so it can't bypass it either — leaving Josh to admin-merge by hand.
#
# How this fixes it WITHOUT new credentials, a second App, or admin:
#   This workflow submits the approving review as `github-actions[bot]` — a
#   DISTINCT identity from the PR-author App — so the self-approval block does
#   not apply. (Org + repo setting "Allow GitHub Actions to create and approve
#   pull requests" was enabled in GOL-304; that is what unblocks this.)
#
# Review gate (unified GOL-1734 / GOL-1738, Ada sign-off — Option B):
#   We fire on the "CI" workflow succeeding — all of this repo's required status
#   checks (Validate Docker Compose, Validate Nginx Config, Lint Python) run
#   inside that single CI workflow, so a green CI == every required check green.
#   For AGENT PRs we then require the company-wide `agent-review/*` check-run
#   (emitted by the github-sync plugin, SHA-bound to the head) to be `success`
#   before approving — the reviewer is COMMENT-only, so the machine signal is a
#   check-run, never a GitHub APPROVE event. Auto-merge still independently
#   waits for ALL required checks before it actually merges.
#
# Human-maintainer path (GOL-1195):
#   The repo owner's OWN PRs hit the same wall from the other side: the ruleset
#   requires 1 approving review, GitHub blocks approving your own PR, and (until
#   now) this workflow skipped all human authors -> the owner's PRs dead-ended
#   with no way to satisfy the gate ("I can't even submit my review if I want
#   to"). We now clear the review gate for a small allowlist of trusted human
#   maintainers by approving as github-actions[bot] (a distinct identity), but
#   we deliberately DO NOT enable auto-merge for them -> the human keeps full
#   control over WHEN their PR merges. CI + required checks still gate.
#
# Guardrails:
#   - Auto-approves only (a) the agent App bot's PRs and (b) an explicit
#     human-maintainer allowlist (MAINTAINERS). All other human/external PRs
#     still keep the normal human-review requirement.
#   - Never approves unless CI passed -> not a blanket rubber-stamp.
#   - Agent PRs get approve + auto-merge; maintainer PRs get approve ONLY
#     (no auto-merge) so the human decides when to merge.
#   - Runs from the base-branch definition (workflow_run), so a PR cannot
#     modify this file to approve itself.
name: Auto-approve verified agent PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Least privilege: only what's needed to review + enable auto-merge.
permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      # GOL-1406-A: base-branch checkout so the Tier-0 carve-out below runs the
      # base definition of scripts/ci/protected-paths-carveout.mjs, not a
      # PR-supplied one (a PR cannot edit the carve-out to approve itself).
      - name: Check out base-branch scripts (protected-paths carve-out)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Approve (as github-actions[bot]) + enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          # Trusted human maintainers whose own PRs may auto-clear the review
          # gate (space-separated logins). The repo owner cannot self-approve on
          # GitHub, so without this their PRs dead-end. Keep this list minimal.
          MAINTAINERS="EngineeringMoonBear"

          AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author -q '.author.login')
          # App bot logins appear as "app/agenticos-developer" via gh and
          # "agenticos-developer" via some APIs; accept both.
          KIND=""
          case "$AUTHOR" in
            app/agenticos-developer|agenticos-developer) KIND="agent" ;;
          esac
          if [ -z "$KIND" ]; then
            for m in $MAINTAINERS; do
              # Match a bare login ONLY. We intentionally reject the "app/$m"
              # form: real human maintainers always appear as bare logins, never
              # "app/<login>". A GitHub App whose slug happens to equal a
              # maintainer login (e.g. "app/EngineeringMoonBear") must NOT be
              # trusted as a human maintainer — the agent App is matched
              # separately above, and any other App should hit the human-review
              # path, not this allowlist. (GOL-1372 / GOL-1322)
              if [ "$AUTHOR" = "$m" ]; then KIND="maintainer"; break; fi
            done
          fi
          if [ -z "$KIND" ]; then
            echo "PR #$PR author '$AUTHOR' is not the agent App bot or a listed maintainer; skipping (human/external PRs keep human review)."
            exit 0
          fi
          echo "PR #$PR author '$AUTHOR' classified as: $KIND"

          # ── Tier-0 protected-paths carve-out (GOL-1406-A) ──
          # Defense-in-depth before the protected-paths-guard becomes a REQUIRED
          # check: never auto-approve an agent/maintainer PR that touches a
          # protected path — it needs an allowlisted human's SHA-bound review.
          # Same PROTECTED_GLOBS as protected-paths-guard.yml (both generated
          # from AgenticOS scripts/ci/gen-protected-paths-guard.py, so they
          # cannot drift). Fail-closed: if the check cannot run, withhold.
          PR_FILES=$(gh pr view "$PR" --repo "$REPO" --json files -q '.files[].path')
          if REASON=$(PR_FILES="$PR_FILES" node scripts/ci/protected-paths-carveout.mjs); then
            :  # no protected path touched — proceed to approve
          else
            echo "PR #$PR not auto-approved: $REASON"
            exit 0
          fi

          # ── Unified agent-review gate (GOL-1734 / GOL-1738, Ada sign-off) ──
          # AGENT PRs only. The github-sync plugin emits exactly one
          # `agent-review/<reviewer>` check-run per non-draft agent PR: seeded
          # `in_progress` on open, flipped to `success` ON THAT HEAD SHA only
          # when the reviewer signs the review issue `done`. COMMENT-only — the
          # signal is a check-run, never a GitHub APPROVE event. Require it
          # PRESENT and `success` on the CURRENT head SHA: absent / in_progress /
          # neutral / failure / success-on-old-SHA => BLOCK. Native `--auto`
          # merge only waits for REQUIRED checks, and agent-review/* is not a
          # required check, so this explicit gate is what enforces review here.
          # Maintainer PRs are exempt (a human reviews them by hand). Poll so a
          # sign-off landing shortly after CI is caught; a later sign-off
          # re-fires on the next CI run.
          if [ "$KIND" = "agent" ]; then
            HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q '.headRefOid')
            REVIEW_STATE=absent
            for i in $(seq 1 30); do   # up to ~15 min (30 × 30s)
              REVIEW_STATE=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
                -q '[.check_runs[] | select(.name | startswith("agent-review/"))]
                     | if length==0 then "absent"
                       elif any(.[]; .status=="completed" and .conclusion=="success") then "success"
                       elif all(.[]; .status=="completed") then "completed-not-success"
                       else "pending" end')
              case "$REVIEW_STATE" in
                success|completed-not-success) break ;;
              esac
              echo "agent-review/* on $HEAD_SHA: $REVIEW_STATE (poll $i/30)…"
              sleep 30
            done
            if [ "$REVIEW_STATE" != "success" ]; then
              echo "PR #$PR agent-review/* gate not satisfied on $HEAD_SHA (state: $REVIEW_STATE); not approving. The reviewer must sign off (COMMENT-only gate — GOL-1734)."
              exit 0
            fi
            echo "agent-review/* is success on $HEAD_SHA; proceeding."
          fi

          # Don't stack duplicate approvals on re-runs.
          ALREADY=$(gh api "repos/$REPO/pulls/$PR/reviews" \
            -q '[.[] | select(.user.login=="github-actions[bot]" and .state=="APPROVED")] | length')
          if [ "${ALREADY:-0}" -gt 0 ]; then
            echo "PR #$PR already approved by github-actions[bot]."
          else
            gh pr review "$PR" --repo "$REPO" --approve --body \
              "Auto-approved by github-actions[bot]: CI (which runs all required status checks) passed. This identity is distinct from the PR author, so it satisfies branch protection's review requirement. Functional required status checks still gate the actual merge. (GOL-308 / GOL-1195)"
          fi

          # Maintainer PRs: approve ONLY. The human decides when to merge, so we
          # do not enable auto-merge or direct-merge on their behalf.
          if [ "$KIND" = "maintainer" ]; then
            echo "PR #$PR is a maintainer PR: review gate cleared; leaving merge to the author."
            exit 0
          fi

          # Turn on auto-merge so GitHub merges once ALL required checks are green.
          # No-op-safe: needs the repo "Allow auto-merge" setting enabled.
          #
          # GOL-938: enabling auto-merge FAILS on a PR that is ALREADY mergeable
          # (GitHub rejects `--auto` with "Pull request is in clean status" —
          # there's nothing to wait for). That happens exactly when CI's final
          # required check goes green just before / as we approve, so the PR is
          # instantly clean. The old bare `|| echo` swallowed that error and left
          # the PR sitting un-merged (autoMergeRequest=null), forcing a manual
          # `gh pr merge`. Fall back to a DIRECT squash merge in that case.
          if merge_err=$(gh pr merge "$PR" --repo "$REPO" --auto --squash 2>&1); then
            echo "Auto-merge enabled for PR #$PR; GitHub will merge once required checks are green."
          else
            echo "Enable auto-merge failed: $merge_err"
            echo "PR may already be mergeable (clean status); attempting a direct squash merge..."
            if direct_err=$(gh pr merge "$PR" --repo "$REPO" --squash 2>&1); then
              echo "PR #$PR merged directly."
            else
              echo "::warning::Could not enable auto-merge OR merge PR #$PR directly."
              echo "::warning::auto-merge error: $merge_err"
              echo "::warning::direct-merge error: $direct_err"
              echo "::warning::Approval still stands; a maintainer must merge (check 'Allow auto-merge' + branch is up to date)."
            fi
          fi
