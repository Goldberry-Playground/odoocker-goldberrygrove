name: Provision CEO Odoo Login

###############################################################################
# GOL-1780 — bootstrap the CEO's FIRST prod Odoo res.users login. Josh has no
# Odoo account anywhere (only API service keys + the master/DB password exist),
# so https://odoo.gatheringatthegrove.com/web/login is unusable by him and every
# catalog-data fix (GOL-408 nursery photos, $0.00 prices) is gated on this.
#
# MECHANISM (same as provision-logistics-otto / GOL-89, CEO-ratified)
#   SSH to the prod droplet as root and pipe scripts/provision_ceo_user_shell.py
#   into `docker compose ... exec -T odoo odoo shell`. Inside the shell `env`
#   runs as SUPERUSER, so no admin login/API key is needed — which is the whole
#   point, since none exists to bootstrap from. XML-RPC cannot be used: it needs
#   a res.users credential we do not have.
#
# CREDENTIAL DELIVERY — nothing secret ever touches this (durable) log.
#   LIVE runs pass CEO_DELIVER=email: the script calls action_reset_password()
#   so Odoo EMAILS Josh a one-time set-password link. He sets his OWN password
#   and stores it in 1Password (Grove Prod) himself. No plaintext is minted,
#   printed, or written by this workflow. If prod SMTP is not wired the step
#   fails LOUD (rc=4) — use the manual SSH path in docs/RUNBOOK-provision-ceo-
#   odoo-login.md, which prints a one-time link to the operator's own terminal.
#
# GOVERNANCE — the `production` GitHub Environment approval IS the CEO gate on
#   this prod-credential action. Dry-run needs no approval and writes nothing;
#   live requires the environment reviewer.
#
# SECRETS PREREQUISITE — this workflow (and release.yml) read PROD_SSH_PRIVATE_KEY
#   and PROD_HOST. As of 2026-08-31 NEITHER secret exists at repo level or in the
#   `production` environment (`gh secret list` is empty), so this workflow CANNOT
#   run yet — the "Add droplet to known hosts" step exits 1 on the empty HOST.
#   Provisioning these two secrets is a DevOps/CEO task (owner: Terra + Josh); the
#   private key must match an authorized_keys entry on the prod droplet and
#   PROD_HOST is the droplet IP/host. Until then use the manual SSH path in
#   docs/RUNBOOK-provision-ceo-odoo-login.md (Path B).
#
# IDEMPOTENT — find-or-create; re-running only re-ensures groups + re-sends the
#   set-password email. Safe to re-run.
###############################################################################

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the scope preview + SMTP/auth_signup posture only — create nothing"
        type: boolean
        required: true
        default: true

concurrency:
  group: provision-ceo-odoo-login
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    name: Provision CEO login (${{ inputs.dry_run && 'dry-run' || 'LIVE' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both modes SSH into the prod droplet, so both sit behind the `production`
    # environment reviewer — the CEO approval gate for this prod-credential
    # action. (Dry-run writes nothing but still touches prod over SSH.)
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2

      - name: Load SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        timeout-minutes: 2
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # GOL-3414: grove-prod-odoo's public :22 is fenced to admin_ip_cidrs
      # (grove-prod-odoo-fw, GOL-2565), and GitHub-hosted runners egress from
      # ~7,000 rotating Azure CIDRs, so a prod dispatch died in the keyscan
      # below before this step existed. Same mechanism as the agent plane
      # (GOL-3412): a SECOND, CI-owned firewall on the same droplet
      # (`grove-prod-odoo-ci-fw`, infra/terraform/environments/production/
      # prod-odoo-ci-fw.tf, ignore_changes on inbound_rule) gets one transient
      # tcp/22 rule for this runner's /32; DO unions firewalls, so the
      # Terraform-managed fence is never touched. The action is AgenticOS's,
      # pinned by SHA and parameterised by droplet/firewall name. Token:
      # secrets.DO_FIREWALL_TOKEN (scoped droplet:read + firewall:*) when set,
      # else the account DO token via the same 1Password service account every
      # other prod workflow here already uses. Paired with the always() revoke
      # step at the end of the job. docs/RUNBOOK-prod-odoo-ci-fence-GOL-3414.md
      - name: Admit this runner through the prod Odoo fence (GOL-3414)
        uses: Goldberry-Playground/AgenticOS/.github/actions/agent-plane-fence@de4cc450b059043bc1dc1b7aa8c1e49f1de869e1 # GOL-3412 (#899)
        timeout-minutes: 3
        with:
          mode: admit
          do-token: ${{ secrets.DO_FIREWALL_TOKEN }}
          op-service-account-token: ${{ secrets.OP_CI_SA_TOKEN }}
          do-token-ref: op://Grove Prod/odoocker/DIGITALOCEAN_TOKEN
          droplet-name: grove-prod-odoo
          firewall-name: grove-prod-odoo-ci-fw
          host: ${{ secrets.PROD_HOST }}

      - name: Add droplet to known hosts
        timeout-minutes: 4
        env:
          HOST: ${{ secrets.PROD_HOST }}
          TARGET: prod
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ]; then
            echo "::error::PROD_HOST is not set -- cannot reach the droplet. Seed it as a repo secret first (docs/RUNBOOK-prod-odoo-ci-fence-GOL-3414.md, 'One-time setup')."
            exit 1
          fi
          mkdir -p ~/.ssh
          # GOL-3414: the old bare `ssh-keyscan ... 2>/dev/null` hid the only
          # evidence of the fence (5 silent timeouts) and would also have passed
          # on an EMPTY successful scan, failing one step later on an
          # unverifiable host key. Retry with backoff, keep stderr, require a key.
          scan_out="$(mktemp)"
          scan_err="$(mktemp)"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "$HOST" > "$scan_out" 2> "$scan_err" && [ -s "$scan_out" ]; then
              cat "$scan_out" >> ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts
              echo "Host key pinned on attempt ${attempt}/5."
              exit 0
            fi
            echo "::warning title=ssh-keyscan retry::Attempt ${attempt}/5 produced no host key. stderr follows."
            cat "$scan_err" >&2
            sleep $(( attempt * 5 ))
          done
          echo "::error title=ssh-keyscan failed::No host key from ${TARGET} after 5 attempts (~75s). On prod the public :22 is fenced to operator IPs (grove-prod-odoo-fw, GOL-2565): a runner only gets in when the admit step above printed 'Admitting <ip>/32' (docs/RUNBOOK-prod-odoo-ci-fence-GOL-3414.md). If it did and this still fails, the droplet is likely down -- check the DigitalOcean console before re-running."
          exit 1

      - name: Provision CEO login
        id: provision
        timeout-minutes: 6
        env:
          HOST: ${{ secrets.PROD_HOST }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # DB name is read from the droplet's own .env — never hardcoded.
          # LIVE -> email delivery (nothing secret printed); dry-run -> preview.
          REMOTE_ENV="-e CEO_DELIVER=email"
          [ "$DRY" = "true" ] && REMOTE_ENV="-e CEO_DRY_RUN=1"
          # The live prod droplet runs a SINGLE docker-compose.yml under
          # /etc/grove (no /opt/grove, no override files) — confirmed off the
          # running container's own compose labels, 2026-08-31. DB_NAME comes
          # from /etc/grove/.env.
          ssh -o StrictHostKeyChecking=yes "root@${HOST}" \
            "set -a; . /etc/grove/.env; set +a; \
             cd /etc/grove && docker compose \
               exec -T ${REMOTE_ENV} \
               odoo odoo shell -d \"\$DB_NAME\" --no-http --logfile=/dev/null" \
            < scripts/provision_ceo_user_shell.py \
            | tee provision.out
          echo "----- provision output (no secrets; email delivery on live) -----"
          cat provision.out

      - name: Revoke this runner from the prod Odoo fence (GOL-3414)
        # Pairs with the admit step above. always(): a failed or cancelled job
        # must still drop its /32 from grove-prod-odoo-ci-fw. No-op when nothing
        # was admitted (the job died before admit, or this is the QA leg).
        if: ${{ always() }}
        uses: Goldberry-Playground/AgenticOS/.github/actions/agent-plane-fence@de4cc450b059043bc1dc1b7aa8c1e49f1de869e1 # GOL-3412 (#899)
        timeout-minutes: 3
        with:
          mode: revoke
          do-token: ${{ secrets.DO_FIREWALL_TOKEN }}
          op-service-account-token: ${{ secrets.OP_CI_SA_TOKEN }}
          do-token-ref: op://Grove Prod/odoocker/DIGITALOCEAN_TOKEN
          droplet-name: grove-prod-odoo
          firewall-name: grove-prod-odoo-ci-fw

      - name: Summary
        if: ${{ always() }}
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Provision CEO Odoo Login"
            echo ""
            echo "- mode: $([ "$DRY" = "true" ] && echo 'DRY-RUN (preview only)' || echo 'LIVE')"
            echo "- login: josh@goldberrygrove.farm  (Administration/Settings + Sales/Inventory/Purchase/Website managers)"
            echo "- ODOO_URL: https://odoo.gatheringatthegrove.com/web/login"
            if [ "$DRY" != "true" ]; then
              echo "- delivery: Odoo emailed Josh a one-time set-password link (CEO_DELIVER=email)."
              echo "- NEXT (Josh): open the email link, set your password, then save it in 1Password → Grove Prod."
              echo "- if no email arrives: prod SMTP is unwired — use docs/RUNBOOK-provision-ceo-odoo-login.md (manual SSH, on-terminal link)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
