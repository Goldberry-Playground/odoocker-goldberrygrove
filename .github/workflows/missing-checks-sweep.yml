# Missing-required-check sweep — GOL-1958.
#
# A *required* status check that never STARTS (a dropped GitHub trigger) is
# indistinguishable from one that is still running: the PR hangs at
# "Expected — waiting for status" forever and only a human notices, hours later.
# grove-odoo-modules #141 sat unmergeable ~6.5h this way and was force-merged by
# hand — exactly the escape hatch branch-protection tightening is meant to stop.
#
# CRITICAL DESIGN: this detector runs on `schedule` + `workflow_dispatch`, NOT
# `pull_request`. A pull_request-triggered detector would have been dropped
# alongside the CI run it is meant to catch. It is a cheap, API-only sweep — it
# never checks out or runs PR code.
#
# Logic lives once in the shared action; this file only wires the schedule.
#   Shared action: Goldberry-Playground/grove-sites/.github/actions/ci-failure-router@main
# It reads the declared required contexts from .github/required-checks.json,
# reads check-runs AND commit statuses on each open non-draft PR's head SHA
# (some repos post a required context as a commit status, not a check-run), and
# mints one deduped `ci-failure` issue — mirrored to Paperclip — per PR whose
# required context is absent past the grace window. The issue body carries the
# one-step close/reopen remediation for a human to run. A control-plane drop
# (GOL-3031) is additionally self-healed by a bounded close/reopen, but only
# when the agent App identity below is provisioned; without it the sweep stays
# alert-only.
name: Missing required-check sweep

on:
  schedule:
    - cron: "11,31,51 * * * *" # every 20 min (offset to avoid the top-of-hour herd)
  workflow_dispatch:
    inputs:
      grace-minutes:
        description: Minutes a head SHA must age before a missing check is flagged.
        required: false
        default: "20"

permissions:
  contents: read # read required-checks.json + head commit date
  pull-requests: read # list open PRs. The GOL-3031 self-heal close+reopen runs
    # under the agent App token minted below, NOT this GITHUB_TOKEN: GitHub creates
    # no workflow runs for events triggered by GITHUB_TOKEN, so a reopen made with
    # it would re-fire nothing while the close still disarms auto-merge.
  checks: read # check-runs on the head SHA
  statuses: read # commit statuses on the head SHA
  actions: read # workflow runs + their JOBS on the head SHA — `runner_name` lives
    # only on a job, so this is what tells a control-plane drop apart from a real
    # failure (GOL-3031), and what tells an `action_required` approval gate apart
    # from a dropped trigger (GOL-2732). Also `GET /actions/runs/{id}/pending_deployments`
    # (GOL-2838): names the Environment + approver of a run holding a `concurrency`
    # group; that endpoint needs this scope even though the repo is public.
  issues: write # mint/close the deduped ci-failure issue

concurrency:
  group: missing-checks-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep open PRs for required checks that never started
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GOL-3031: identity for the self-heal close+reopen ONLY. GitHub creates
      # no workflow runs for events triggered by the ambient GITHUB_TOKEN, so a
      # reopen made with it re-fires nothing, while the close still disarms
      # auto-merge, posts a misleading "re-fired" note and spends the re-fire
      # budget. An App-triggered reopen does fire `pull_request: reopened`.
      #
      # Same App + switch as auto-approve.yml's enqueue identity (GOL-2524):
      # `vars.MERGE_QUEUE_APP_CLIENT_ID` unset -> this step is skipped.
      # `continue-on-error` covers a missing or bad private key / an
      # installation lacking the permission. Either way the token output is
      # empty, the router gets `self-heal: "false"`, and the sweep stays
      # alert-only (diagnosis + issue + manual remediation command).
      #
      # Scoped down to what close/reopen needs; issue minting, PR listing and
      # every read stay on GITHUB_TOKEN with the permissions above.
      - name: Mint self-heal identity (agent App)
        id: refire-identity
        if: vars.MERGE_QUEUE_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MERGE_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_QUEUE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - uses: Goldberry-Playground/grove-sites/.github/actions/ci-failure-router@main
        with:
          mode: missing-checks
          github-token: ${{ github.token }}
          grace-minutes: ${{ github.event.inputs.grace-minutes || '20' }}
          self-heal: ${{ steps.refire-identity.outputs.token != '' && 'true' || 'false' }}
          refire-token: ${{ steps.refire-identity.outputs.token }}
