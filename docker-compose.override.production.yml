services:
  odoo:
    restart: unless-stopped
    ports:
      - 127.0.0.1:8069:8069
      - 127.0.0.1:8070:8070
      - 127.0.0.1:8071:8071
      - 127.0.0.1:8072:8072
    deploy:
      resources:
        limits:
          # Adjust to your DigitalOcean droplet size.
          # Recommended minimum for 3 businesses + inventory: 4 GB RAM, 2 vCPU
          memory: 2G
        reservations:
          memory: 512M

  postgres:
    restart: unless-stopped
    ports:
      - 127.0.0.1:5432:5432
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

  custom-modules-sync:
    restart: unless-stopped
    environment:
      # Supply-chain hardening: production pins to a specific commit SHA from
      # grove-odoo-modules, NOT a branch. A push to `main` will NOT auto-deploy
      # to production — bumping requires an infra PR that updates this SHA.
      # See docs/DEPLOYMENT.md "Bumping the prod modules SHA" for the workflow.
      # Closes Asana 1215643893776947.
      #
      # GOL-484 checkout go-live (board-approved 2026-08-07, interaction
      # 5b2c6abb): bumped 515dcb3f -> 8accb94, the first checkout-capable
      # grove_headless HEAD (exposes /grove/api/v1/products|cart|shipping|
      # stripe/webhook; the old 515dcb3f pin predates checkout and live prod
      # 404s on those routes -- GOL-484 recon). Kept in lockstep with the
      # terraform prod pin var.custom_modules_ref so BOTH deploy paths converge
      # on the same reviewed SHA regardless of which one drives the live box.
      # Takes effect only on a DELIBERATE deploy/rebuild (supply-chain pin; a
      # push to main never auto-deploys). Prod grove_headless is UNINSTALLED
      # (GOL-1258) -> the go-live rebuild does a FRESH --init grove_headless,
      # not an upgrade (GOL-1214 sign-off); non-destructive on the bare DB.
      - GITSYNC_REF=8accb943d664a78df69f79eab689e7024d2b2445

  nginx:
    restart: unless-stopped

  nginx-proxy:
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443

  letsencrypt:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  s3:
    restart: unless-stopped

  pgadmin:
    restart: unless-stopped
