###############################################################################
# Beyla eBPF config — Odoo RED metrics (GOL-2332, spec §3 "APM eBPF-first").
#
# Beyla attaches eBPF uprobes to the Odoo WSGI process (discovered by its listen
# port) and emits RED metrics (Rate / Errors / Duration p50/p95/p99) per HTTP
# route, with ZERO Odoo code. It exports OTLP to the local otel-collector, which
# forwards to OpenObserve (see otel/otelcol-config.yaml).
#
# WHY A CONFIG FILE (not pure env like the older inline services): the `routes`
# block below is config-file-only in Beyla. Without route grouping, high-
# cardinality paths (…/products/1234) each become their own series and the
# per-endpoint p95 the alerts query (odoo-orders-latency, odoo-products-latency)
# never forms. `unmatched: heuristic` collapses id-like path segments to `*`, so
# every endpoint gets ONE low-cardinality route series automatically; the
# explicit `patterns` just guarantee clean canonical names for the money paths.
#
# PENDING LIVE VALIDATION (same convention as alerts.json / otelcol-config.yaml):
# the `/grove/api/v1/*` patterns are taken from the grove_headless controllers
# (verified against grove-odoo-modules main 2026-09-21). What still needs live
# confirmation is the OpenObserve column naming (http_route / service_name) on
# the first real prod Beyla traffic; `unmatched: heuristic` covers new routes.
###############################################################################

# Discover the Odoo process by its listen port (WSGI on 8069) and label its
# telemetry. Env (OTEL_SERVICE_NAME / BEYLA_SERVICE_NAMESPACE) still applies and
# takes precedence; kept here so the file is self-describing.
discovery:
  services:
    - open_ports: "8069"
      name: odoo
      namespace: grove

# Per-route RED grouping. `heuristic` is the active fallback for every route;
# the explicit patterns pin canonical names for the endpoints the alerts watch.
# Pattern list = the grove_headless controller surface (grove-odoo-modules
# `@http.route('/grove/api/v1/...')`), with Odoo `<int:x>` converters written as
# Beyla `{x}` path params (a bare `*` is a literal in Beyla, not a wildcard).
# The alerts match http_route EXACTLY ('/grove/api/v1/orders', '/products'), so
# keep those two entries byte-identical to openobserve/alerts.json.
routes:
  unmatched: heuristic
  patterns:
    - /grove/api/v1/health
    - /grove/api/v1/zone
    - /grove/api/v1/products
    - /grove/api/v1/products/{product_id}
    - /grove/api/v1/cart
    - /grove/api/v1/checkout/session
    - /grove/api/v1/orders
    - /grove/api/v1/orders/{order_id}
    - /grove/api/v1/orders/{order_id}/mark-shipped
    - /grove/api/v1/shipping/options
    - /grove/api/v1/shipping/rates
    - /grove/api/v1/shipping/webhook
    - /grove/api/v1/stripe/webhook
    - /grove/api/v1/newsletter/subscribe

# OTLP metrics export → local collector. Endpoint/protocol are also set via env
# in the compose service (OTEL_EXPORTER_OTLP_ENDPOINT/_PROTOCOL); env wins, this
# documents the intent. `application` gives RED HTTP metrics; `application_span`
# gives the trace spans that stitch into the Next.js → Odoo trace.
otel_metrics_export:
  features:
    - application
    - application_span
  interval: 30s
