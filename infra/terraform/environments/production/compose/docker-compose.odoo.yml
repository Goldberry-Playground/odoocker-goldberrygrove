# docker-compose for the Level 3 PRODUCTION Odoo droplet (ADR-007 Phase 6).
#
# Copied from the validated QA L3 compose (environments/qa-app-platform/
# compose/docker-compose.qa.yml). Two deliberate divergences from QA:
#   1. caddy: official `caddy` image + Origin CA cert files (no ACME, no
#      grove-caddy DO-DNS plugin) - matches the blogs droplet, since prod
#      Odoo is Cloudflare-proxied. No /mnt/caddy-data ACME volume needed.
#   2. odoo: APP_ENV=production (single fixed Managed-PG DB, --init=base on
#      first boot, no --update=all churn on restart - see odoo/entrypoint.sh).
#
# Three services: caddy (TLS + reverse proxy), odoo, and custom-modules-sync
# (git-sync sidecar that delivers grove_headless et al. into /workspace/current;
# ADDONS_PATH in /etc/grove/.env includes it). Postgres is OFFLOADED to DO
# Managed PG - Odoo connects over the private VPC network via env.

services:
  caddy:
    image: caddy:${CADDY_TAG:-2-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/grove/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/grove/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - grove
    depends_on:
      odoo:
        condition: service_started

  odoo:
    image: ghcr.io/goldberry-playground/grove-odoo:${ODOO_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8069"
      - "8072" # longpolling
    environment:
      HOST: ${DB_HOST}
      PORT: ${DB_PORT}
      USER: ${DB_USER}
      PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ADMIN_PASSWD: ${ODOO_ADMIN_PASSWORD}
      # production branch of the entrypoint dispatcher: fixed single DB
      # (DB_NAME), --init=base first-boot bootstrap, no --update=all on
      # restart. See odoo/entrypoint.sh (fixed for the L3 single-DB shape
      # under GOL-105).
      APP_ENV: production
      WORKERS: "2"
      # Trust Caddy's X-Forwarded-* headers (CSRF + URL generation).
      PROXY_MODE: "true"
      LIST_DB: "false" # one fixed DB; hide the selector
      # GOL-1859: the prod host Odoo bakes into every absolute URL it emits
      # (password-reset / portal / e-commerce links, report.url). entrypoint.sh's
      # seed_web_base_url() upserts web.base.url + web.base.url.freeze=True from
      # this on every boot, so a droplet rebuild (GOL-920) or fresh bootstrap
      # converges to the real host instead of drifting to localhost:8069. Sourced
      # from --env-file /etc/grove/.env (cloud-init writes it from TF var
      # web_base_url). Empty default keeps the seed a no-op until the value lands.
      WEB_BASE_URL: ${WEB_BASE_URL:-}
      # GOL-1009: run a blocking `-u grove_headless` at boot whenever the
      # git-synced modules revision advances, so new models' DB tables are
      # created on deploy. The production branch boots --init=base with NO
      # --update by design (prod upgrades are a deliberate deploy, not a
      # per-restart side effect); this scopes the upgrade to a REVISION ADVANCE
      # only, which on prod means a deliberate git-sync SHA-pin bump (GOL-987) --
      # NOT every `restart: unless-stopped` bounce. Without it, prod hits the
      # identical missing-table 500 when the GOL-985 publish flow rolls out.
      # Idempotent + rev-gated in odoo/entrypoint.sh (marker on the durable
      # /mnt/odoo-filestore volume). Fails loud on a bad migration rather than
      # serving a half-migrated DB.
      # GOL-2039: append grove_support (Grove Support Chat glue, GOL-2022) so the
      # rev-gated boot upgrade installs it on the NEXT prod git-sync SHA-pin bump
      # (GOL-987) that includes grove-odoo-modules PR #171. Deps im_livechat / crm /
      # sale auto-install transitively via --init=base,<mods>. GATED: do NOT ship
      # this list to a prod pin whose SHA lacks grove_support, or entrypoint's
      # --init=base,grove_support crash-loops odoo (module not in addons_path).
      AUTO_UPGRADE_MODULES: grove_headless,grove_support
      # Stripe LIVE-mode prod checkout (GOL-973). grove_headless reads these
      # from os.environ (LOWERCASE names, controllers/main.py). The odoo process
      # env comes ONLY from this compose environment block -- the /.env mount
      # below feeds odoorc.sh's odoo.conf substitution, NOT os.environ. Values
      # come from `docker compose --env-file /etc/grove/.env` (cloud-init writes
      # stripe_test_* there from TF_VAR_stripe_test_*). DEDICATED backend key,
      # never a storefront key (runbook §4) -- prod must not repeat QA's shared-
      # key shortcut or revoking a storefront key would kill checkout. Default-
      # empty so the controller no-ops (checkout inert / webhook not verified)
      # until CFO mints the live keys AND the board greenlights a rebuild.
      stripe_test_secret_key: ${stripe_test_secret_key:-}
      stripe_test_webhook_secret: ${stripe_test_webhook_secret:-}
      # Per-tenant Stripe webhook signing secrets (GOL-973 Gap A, mirrors QA
      # GOL-1016 docker-compose.qa.yml). grove_headless tries EACH non-empty
      # secret against the incoming Stripe-Signature (GOL-1020) so all three LLC
      # storefronts sign the one Odoo endpoint. Legacy stripe_test_webhook_secret
      # above stays unset in prod (Josh 2026-08-27); default-empty here => that
      # tenant's secret is simply not tried.
      stripe_webhook_secret_nursery: ${stripe_webhook_secret_nursery:-}
      stripe_webhook_secret_ggg: ${stripe_webhook_secret_ggg:-}
      stripe_webhook_secret_goldberry: ${stripe_webhook_secret_goldberry:-}
      # Shippo fulfillment (GOL-988). Outbound label purchase reads
      # SHIPPO_API_KEY (sale_order.py, UserError when empty); inbound tracking
      # webhook compares GROVE_SHIPPO_WEBHOOK_TOKEN (controllers/main.py,
      # fail-closed when empty). Same --env-file source as stripe_test_*.
      SHIPPO_API_KEY: ${SHIPPO_API_KEY:-}
      GROVE_SHIPPO_WEBHOOK_TOKEN: ${GROVE_SHIPPO_WEBHOOK_TOKEN:-}
      # Discord #grove-ops alerting (GOL-1935, parent GOL-1933). grove_headless
      # _notify_discord() reads DISCORD_OPS_WEBHOOK_URL from os.environ and POSTs
      # a Discord-native payload to the BARE webhook (NO /slack suffix -- that
      # suffix is only for DigitalOcean's Slack-shaped alert payload, appended by
      # production/observability.tf). Like the stripe_test_* / SHIPPO_* vars
      # above, the odoo process env comes ONLY from this block -- the /.env mount
      # feeds odoorc.sh's odoo.conf substitution, NOT os.environ -- so an unlisted
      # var in /etc/grove/.env never reaches the container (the footgun that left
      # every oversell/refund/new-order alert a silent no-op on prod). Value is
      # interpolated from `docker compose --env-file /etc/grove/.env` (cloud-init
      # writes it from TF var discord_webhook_url, the same bare webhook
      # observability.tf already pages on). Empty default keeps _notify_discord a
      # no-op on any env that does not set it.
      DISCORD_OPS_WEBHOOK_URL: ${DISCORD_OPS_WEBHOOK_URL:-}
    # GOL-746: gate the Odoo start on git-sync's FIRST clone. depends_on
    # (service_started) only guarantees the sidecar CONTAINER started, not
    # that /workspace/current is populated. On the 2026-07-22 droplet replace
    # Odoo booted ~3 min before the first clone finished and compiled STORED
    # asset bundles with the synced addons absent, baking "Could not get
    # content for web_dark_mode/..." into the bundles (dark-mode CSS became a
    # 642-byte error stub). The poison persisted after the module arrived;
    # only a container restart + bundle invalidation cleared it -- and it
    # recurs on every replace. This entrypoint override blocks until a stable
    # sentinel module manifest (grove_headless, the load-bearing headless-API
    # module always present at the repo root) exists, so Odoo never compiles
    # bundles against an empty addons_path.
    #
    # Overriding entrypoint CLEARS the image CMD, so `command: [odoo]` restores
    # the upstream default the image's /entrypoint.sh dispatches on (case
    # "$1" in -- | odoo). The wait is BOUNDED (300s/attempt, override via
    # GITSYNC_GATE_TIMEOUT) and fails LOUD (exit 1) rather than proceeding
    # module-less; restart:unless-stopped re-runs the gate and re-logs each
    # cycle, so a stuck sync is visible in `docker logs` and Odoo never
    # silently re-poisons bundles.
    #
    # Runtime shell vars are written `$$var` (NOT `$var`): docker compose
    # interpolates `$var` in this file at `up` time, and with no such compose
    # var it substitutes EMPTY -- turning the gate into `[ ! -f "" ]` (always
    # true) so Odoo hangs forever and never starts. `$$` -> literal `$` reaches
    # bash. Do NOT "simplify" these back to single `$`. (GOL-746 first-boot bug.)
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu
        sentinel="/workspace/current/grove_headless/__manifest__.py"
        timeout="$${GITSYNC_GATE_TIMEOUT:-300}"
        waited=0
        while [ ! -f "$$sentinel" ]; do
          if [ "$$waited" -ge "$$timeout" ]; then
            echo "FATAL(GOL-746): git-sync sentinel $$sentinel absent after $${timeout}s; refusing to start Odoo with an empty addons_path (would bake poisoned asset bundles). Exiting for restart." >&2
            exit 1
          fi
          echo "GOL-746 gate: waiting for git-sync first clone ($${waited}/$${timeout}s): $$sentinel not present yet" >&2
          sleep 5
          waited=$$((waited + 5))
        done
        echo "GOL-746 gate: sentinel present ($$sentinel); starting Odoo."
        exec /entrypoint.sh "$$@"
      - --
    command: ["odoo"]
    volumes:
      # Durable DO block volume (GOL-93). Survives a droplet replace so product
      # photos + ir.attachment binaries are not lost on recreate. cloud-init
      # chowns it to 101:101 (official odoo image uid:gid) before this comes up.
      - /mnt/odoo-filestore:/var/lib/odoo
      # LOAD-BEARING: grove-odoo's entrypoint runs /odoorc.sh (substitutes the
      # placeholder strings in /etc/odoo/odoo.conf) ONLY when /.env exists in
      # the container. Without this mount Odoo crash-loops on a raw ${DB_PORT}.
      - /etc/grove/.env:/.env:ro
      # Custom modules delivered by the custom-modules-sync sidecar below.
      - custom-modules-data:/workspace:ro
    networks:
      - grove
    depends_on:
      custom-modules-sync:
        condition: service_started

  # git-sync clones grove-odoo-modules and maintains /workspace/current ->
  # latest. The repo is PUBLIC, so no credentials here - keep /etc/grove/.env
  # credential-light (it is mode 0644).
  custom-modules-sync:
    image: registry.k8s.io/git-sync/git-sync:${GIT_SYNC_TAG:-v4.2.3@sha256:19cc7c317d125c5737ecb9a9159d00b5d97f39c45225c6483de365d62fc09fa8}
    restart: unless-stopped
    user: "0:0"
    volumes:
      - custom-modules-data:/workspace
    environment:
      - GITSYNC_REPO=${CUSTOM_MODULES_REPO:-https://github.com/Goldberry-Playground/grove-odoo-modules.git}
      # No :-main fallback: prod MUST pin a reviewed SHA (GOL-892). If
      # CUSTOM_MODULES_REF is unset/empty, compose fails LOUD at `up` rather
      # than silently syncing the moving main branch. TF writes it into
      # /etc/grove/.env from var.custom_modules_ref (validated 40-char SHA).
      - GITSYNC_REF=${CUSTOM_MODULES_REF:?prod requires a pinned grove-odoo-modules SHA (GOL-892); set custom_modules_ref}
      - GITSYNC_ROOT=/workspace
      - GITSYNC_LINK=current
      - GITSYNC_DEPTH=1
      - GITSYNC_PERIOD=${CUSTOM_MODULES_SYNC_PERIOD:-60s}
    networks:
      - grove

networks:
  grove:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  # No odoo-filestore named volume - the filestore is a durable DO block volume
  # bind-mounted at /mnt/odoo-filestore (GOL-93).
  custom-modules-data:
